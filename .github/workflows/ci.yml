name: 游戏持续集成

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 配置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: springboot-backend/pom.xml
      - name: 运行后端测试
        working-directory: springboot-backend
        run: mvn --batch-mode test

  player-frontend:
    name: 玩家端测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-player/package-lock.json
      - name: 安装依赖
        working-directory: frontend-player
        run: npm ci
      - name: 运行单元测试
        working-directory: frontend-player
        run: npm test -- --reporter=dot
      - name: 构建玩家端
        working-directory: frontend-player
        run: npm run build

  admin-frontend:
    name: 管理端构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - name: 安装依赖
        working-directory: frontend-admin
        run: npm ci
      - name: 构建管理端
        working-directory: frontend-admin
        run: npm run build

  isolated-browser-e2e:
    name: H2 隔离浏览器流程
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 配置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: springboot-backend/pom.xml
      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-player/package-lock.json
      - name: 安装玩家端依赖
        working-directory: frontend-player
        run: npm ci
      - name: 安装隔离浏览器
        working-directory: frontend-player
        run: npx playwright install --with-deps chromium
      - name: 配置浏览器可执行文件
        working-directory: frontend-player
        run: node -e 'const { chromium } = require("@playwright/test"); console.log("READER_E2E_EDGE_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - name: 启动玩家端静态开发服务器
        working-directory: frontend-player
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/player-vite.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/player-vite.log"
          exit 1
      - name: 运行 H2 隔离浏览器全链路
        working-directory: springboot-backend
        run: >-
          mvn --batch-mode
          -Dreader.e2e.live-ui=true
          -Dtest=CombatPersistenceIntegrationTest#isolatedHttpStoryExplorationChoiceBattleRewardsAndAcknowledgementFormOneFlow,QuestGameplayPersistenceIntegrationTest#successfulExplorationProgressCanBeClaimedOnceIntoResourcesAndExperience
          test
