name: CI — 测试 & 部署通知

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: JS syntax check (frontend)
        run: |
          node -e "
          const fs = require('fs');
          const files = ['public/src/storage.js','public/src/api.js','public/src/ui.js','public/src/gameClient.js','public/src/main.js'];
          let ok = true;
          files.forEach(f => {
            try { new Function(fs.readFileSync(f,'utf8')); console.log('  PASS: ' + f); }
            catch(e) { console.error('  FAIL: ' + f + ' — ' + e.message); ok = false; }
          });
          if (!ok) process.exit(1);
          "

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Railway 自动部署通知
        run: |
          echo "所有测试通过。Railway 将自动从 master 分支部署。"
          echo "部署状态请查看: https://railway.app/dashboard"
