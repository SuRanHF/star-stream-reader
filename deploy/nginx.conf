server {
    listen 80;
    server_name _;  # 替换为你的域名或 IP

    # 玩家前端
    location / {
        root C:/reader-game/frontend-player;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 管理后台
    location /admin {
        alias C:/reader-game/frontend-admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # API 反向代理到 Spring Boot
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root C:/reader-game;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 日志
    access_log C:/reader-game/logs/nginx-access.log;
    error_log C:/reader-game/logs/nginx-error.log;
}
