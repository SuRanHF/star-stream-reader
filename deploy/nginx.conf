# ==================== HTTP → HTTPS 重定向 ====================
server {
    listen 80;
    server_name reader-scenario-game.bbroot.com;

    # Let's Encrypt ACME 验证
    location /.well-known/acme-challenge/ {
        root C:/reader-game/ssl;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==================== HTTPS 主站 ====================
server {
    listen 443 ssl http2;
    server_name reader-scenario-game.bbroot.com;

    # ==========================================
    # SSL 证书 (通过 win-acme 自动申请)
    # 安装 win-acme 后会自动生成，无需手动操作
    # ==========================================
    ssl_certificate     C:/reader-game/ssl/reader-scenario-game.bbroot.com-chain.pem;
    ssl_certificate_key C:/reader-game/ssl/reader-scenario-game.bbroot.com-key.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # 玩家前端
    location / {
        root C:/reader-game/frontend-player;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 管理后台
    location /admin {
        alias C:/reader-game/frontend-admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # API 反向代理到 Spring Boot
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root C:/reader-game;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 日志
    access_log C:/reader-game/logs/nginx-access.log;
    error_log  C:/reader-game/logs/nginx-error.log;
}
