server {
    listen 80;
    server_name reader-scenario-game.bbroot.com;

    location /.well-known/acme-challenge/ {
        root /opt/reader-game/ssl;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name reader-scenario-game.bbroot.com;

    ssl_certificate     /opt/reader-game/ssl/fullchain.pem;
    ssl_certificate_key /opt/reader-game/ssl/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ── 管理后台 SPA ──
    # /admin 不带斜杠跳转到 /admin/
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /opt/reader-game/frontend-admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ── 玩家端 SPA ──
    location / {
        root /opt/reader-game/frontend-player;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── API 代理 ──
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # ── 静态资源缓存 ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /opt/reader-game/logs/nginx-access.log;
    error_log  /opt/reader-game/logs/nginx-error.log;
}
