# ==================== 开发环境配置 ====================

server:
  port: 3174

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reader_game}?useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:20059603}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置 (Spring Boot 默认)
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000

  # SQL 初始化 (仅开发环境可开启)
  sql:
    init:
      mode: never

# 管理员配置
admin:
  key: reader-admin-2026

# 开发环境详细日志
logging:
  level:
    com.huazhenghai.readergame: debug
    com.baomidou.mybatisplus: debug
