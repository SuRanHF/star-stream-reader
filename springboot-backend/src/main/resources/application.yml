# ==================== Spring Boot 主配置 ====================

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# 仅开放精简健康状态和非敏感应用信息；不暴露 env、beans、配置属性等管理端点。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        # Redis 只承载可降级缓存，不应阻止实例接收游戏请求。
        readiness:
          include: readinessState,db

info:
  app:
    name: 星流读者
    version: ${APP_VERSION:0.1.0}

spring:
  # 默认激活 dev 环境, 生产环境通过 --spring.profiles.active=prod 覆盖
  profiles:
    active: dev

  # Jackson JSON 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_TIMEOUT:500ms}

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  # XML 映射文件路径
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 数据库下划线字段 ↔ Java 驼峰属性 自动映射
    map-underscore-to-camel-case: true
    # 开发环境打印 SQL 日志, 生产环境建议关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略: 自增
      id-type: auto

# ==================== 应用自定义配置 ====================
app:
  security:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3173,http://localhost:3175}
  scheduler:
    # 调度引擎开关（默认开启）
    enabled: true
    # 全局 tick 间隔（毫秒），默认 60 秒
    tick-interval-ms: 60000
  jwt:
    # 必须由本机/部署环境提供，不在仓库保存密钥
    secret: ${JWT_SECRET}
    # Token 过期时间 (小时)
    expire-hours: 168
  cache:
    key-prefix: ${CACHE_KEY_PREFIX:star-reader}
    public-ranking:
      ttl: ${PUBLIC_RANKING_CACHE_TTL:15s}

# ==================== Knife4j 接口文档 ====================
knife4j:
  enable: true
  setting:
    language: zh-CN
